<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Telco Churn</title><body style="font-family:Arial;max-width:600px;margin:40px auto"><h1>Telco Churn Predictor</h1><form id="f">
<label>Antigüedad <input name="tenure" type="number" value="5" min="0" max="100"></label><p><label>Cargo mensual <input name="MonthlyCharges" type="number" value="85.5" step=".01"></label></p><p><label>Cargo total <input name="TotalCharges" type="number" value="427.5" step=".01"></label></p><p><label>Contrato <select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></label></p><p><label>Internet <select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select></label></p><button>Predecir</button></form><pre id="out"></pre><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(let k of ['tenure','MonthlyCharges','TotalCharges'])d[k]=Number(d[k]);let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
